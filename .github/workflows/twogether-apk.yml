name: TwoTogether Android APK
on:
  push:
    paths:
      - 'twogether/**'
      - '.github/workflows/twogether-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: |
          cd twogether
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwoTogether-debug-apk
          path: twogether/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30